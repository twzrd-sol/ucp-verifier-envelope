name: conformance

# Conformance gate for the envelope. Section 8 of spec/envelope.md defines
# "conformant" in prose; this makes it executable.
#
# Two layers, and the split is what makes the gate trustworthy:
#
#   deterministic (on: pull_request). Run each profile's verifier over the
#   bytes committed to the repo, and let the exit code decide. It does NOT
#   regenerate first: a generator that validates what it just produced proves
#   the generator is self-consistent, which is strictly weaker than what an
#   entry bar has to prove. The committed bytes are the only ones a cold
#   reader sees, so they are the only ones the gate may assert. Section 8
#   says a profile MUST ship a runnable verifier over its committed vectors;
#   this is that sentence, executable. No network in this job, so a PR only
#   goes red for a real reason.
#
#   live (on: schedule). cross-verify.mjs mints a real KYA against Facet's
#   production issuer and fetches two live JWKS. Worth having, but it depends
#   on the network and on two issuers being up, so a PR must never go red
#   because a JWKS was slow that minute. It runs on the daily cron instead.

on:
  pull_request:
    paths:
      - 'algovoi-provenance/**'
      - 'fidacy-risk/**'
      - 'fidacy-provenance/**'
      - 'facet-identity/**'
      - 'twzrd-observation/**'
      - '.github/workflows/conformance.yml'
  workflow_dispatch: {}
  schedule:
    # daily, 07:11 UTC; only the live job listens to this
    - cron: '11 7 * * *'

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------
  # Deterministic gate. Runs on every PR touching the profile. No network.
  # ---------------------------------------------------------------------
  algovoi-provenance:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # The profile lands with PR #7. On a ref that predates it, the gate
      # skips with a notice instead of failing on a missing path, so this
      # workflow can merge on its own and the gate arms itself the moment
      # the profile directory exists.
      - name: profile present on this ref
        id: profile
        run: |
          if [ -d algovoi-provenance ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "algovoi-provenance is not on this ref yet (lands with #7); skipping"
          fi
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        if: steps.profile.outputs.present == 'true' 
        with:
          python-version: '3.11'
      # Same three the profile README documents: pqcrypto (FIPS 204 ML-DSA),
      # rfc8785 (JCS canonicalization) and cryptography (the Ed25519 half of
      # the hybrid vectors). Pinned here so the gate does not depend on a
      # reader following the README correctly.
      - name: deps
        if: steps.profile.outputs.present == 'true'
        run: pip install pqcrypto cryptography rfc8785
      - name: verify (the gate; 7/7 or red)
        if: steps.profile.outputs.present == 'true'
        working-directory: algovoi-provenance
        run: python verify.py

  # ---------------------------------------------------------------------
  # The two Fidacy profiles. Same rule as above: the verifier runs over the
  # bytes in the repo, nothing is regenerated first. Split into its own job
  # from the ML-DSA one because the toolchains do not overlap (Node + jose
  # here, Python + pqcrypto there) and a red job should name the profile that
  # broke without a reader having to read the log.
  # ---------------------------------------------------------------------
  fidacy-profiles:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        profile: [fidacy-risk, fidacy-provenance]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
      - name: install
        working-directory: ${{ matrix.profile }}
        run: npm i
      - name: verify committed vectors (the gate)
        working-directory: ${{ matrix.profile }}
        run: node verify.mjs

  # ---------------------------------------------------------------------
  # The Facet identity profile. Same rule again: verify.mjs runs over the
  # bytes in the repo and regenerates nothing. Kept as its own job rather
  # than folded into the Fidacy matrix above, even though the toolchain is
  # the same (Node + jose), because these are different issuers and the job
  # name is what a reader sees first when the gate goes red.
  #
  # This job is why facet-identity being listed in paths: without a job was
  # worth closing quickly rather than leaving: a PR touching only this
  # profile would trigger the workflow, run everyone else's jobs, and report
  # green without anything having checked the profile that changed.
  # ---------------------------------------------------------------------
  facet-identity:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
      - name: install
        working-directory: facet-identity
        run: npm i
      - name: verify committed vectors (the gate; 10/10 or red)
        working-directory: facet-identity
        run: node verify.mjs

  # ---------------------------------------------------------------------
  # The TWZRD seller-observation profile. Same rule: verify.mjs runs over
  # the committed bytes, regenerates nothing, no network. Own job because
  # it is a different issuer.
  # ---------------------------------------------------------------------
  twzrd-observation:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
      # Dependency-free: node:test unit tests, then verify.mjs over the
      # committed vectors.
      - name: test + verify committed vectors (the gate; 10/10 tests, 8/8 vectors or red)
        working-directory: twzrd-observation
        run: npm test

  # ---------------------------------------------------------------------
  # Live end to end. Cron only. Mints a real KYA and verifies two
  # production issuers offline. Never blocks a PR.
  # ---------------------------------------------------------------------
  cross-verify-live:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
      - name: install
        working-directory: cross-verify
        run: npm i
      - name: live end to end (identity + risk, two real JWKS)
        working-directory: cross-verify
        run: node cross-verify.mjs
